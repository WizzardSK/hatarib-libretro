name: preflight (windows mingw cross)
on: [push, workflow_dispatch]

jobs:
  mingw:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [as-is, zlib-include]
    env:
      CC: x86_64-w64-mingw32-gcc-posix
      AR: x86_64-w64-mingw32-ar
      platform: win64
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: sudo apt-get update -qy && sudo apt-get install -qy g++-mingw-w64-x86-64 cmake
      - name: zlib on its own
        run: make -f makefile zlib && ls -la zlib_build/include zlib_build/lib
      - name: as-is
        if: matrix.variant == 'as-is'
        run: make -f makefile.libretro
      - name: with the built zlib's headers on the include path
        if: matrix.variant == 'zlib-include'
        env:
          CFLAGS: -I${{ github.workspace }}/zlib_build/include
        run: make -f makefile.libretro
      - run: ls -la hatarib_libretro.* || true

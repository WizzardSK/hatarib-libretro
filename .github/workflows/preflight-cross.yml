name: preflight (windows mingw cross)
on: [push, workflow_dispatch]

jobs:
  mingw:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [system-name, system-name-and-zlib-include]
    env:
      CC: x86_64-w64-mingw32-gcc-posix
      AR: x86_64-w64-mingw32-ar
      platform: win64
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: sudo apt-get update -qy && sudo apt-get install -qy g++-mingw-w64-x86-64 cmake
      - name: telling cmake it is cross compiling
        if: matrix.variant == 'system-name'
        env:
          CMAKEFLAGS: -DCMAKE_SYSTEM_NAME=Windows
        run: make -f makefile.libretro
      - name: ... and the built zlib's headers
        if: matrix.variant == 'system-name-and-zlib-include'
        env:
          CMAKEFLAGS: -DCMAKE_SYSTEM_NAME=Windows
          CFLAGS: -I${{ github.workspace }}/zlib_build/include
        run: make -f makefile.libretro
      - run: ls -la hatarib_libretro.* && file hatarib_libretro.*
